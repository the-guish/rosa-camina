<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#9d174d">
<title>rosa camina</title>
<meta name="description" content="Comparador de precios de supermercados en Uruguay.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <h1>rosa camina</h1>
  <div class="searchbox">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar un producto…"
           role="combobox" aria-expanded="false" aria-controls="suggestions"
           aria-label="Buscar un producto" aria-autocomplete="list"
           autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="search">
    <button id="clear" type="button" aria-label="Limpiar búsqueda" hidden>&times;</button>
    <ul id="suggestions" role="listbox" aria-label="Sugerencias" hidden></ul>
  </div>
</header>

<main>
  <p id="status" class="status" role="status">Cargando precios…</p>
  <ol id="results" class="results"></ol>
</main>

<footer id="footer"></footer>

<script type="module" src="assets/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f3">
<title>rosa camina</title>
<meta name="description" content="Comparador de precios de supermercados en Uruguay, Argentina y Paraguay.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%23777' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 8h10l7 36'/><path d='M20 20h34l-4 28H26z'/><circle cx='30' cy='54' r='4.5'/><circle cx='47' cy='54' r='4.5'/></svg>">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <h1>rosa camina</h1>
  <p class="motto">Camine, señora, camine.</p>
</header>

<main>
  <p class="status">Precios de supermercados. Elegí un país.</p>
  <ul class="countries">
    <li><a class="card country-link" href="uy/"><span class="flag" aria-hidden="true">🇺🇾</span> Uruguay</a></li>
    <li><a class="card country-link" href="ar/"><span class="flag" aria-hidden="true">🇦🇷</span> Argentina</a></li>
    <li><a class="card country-link" href="py/"><span class="flag" aria-hidden="true">🇵🇾</span> Paraguay</a></li>
    <li><a class="card country-link" href="mundo/"><span class="flag" aria-hidden="true">🌎</span> Mundo <span class="hint">todos los países, en dólares</span></a></li>
  </ul>
</main>

<footer>
  <button id="refresh" class="refresh" type="button">Actualizar el sitio</button>
  <span id="refresh-status" role="status"></span>
</footer>

<!-- Inline on purpose: a separate file could be the stale copy this is here
     to replace. A browser keeps the pages, the script and the stylesheet for
     ten minutes (longer if it feels like it), so after a release a phone can
     run a new page with the old script. This downloads each of them again,
     past the cache and into it, drops the cached catalogues, and reloads. -->
<script>
document.getElementById('refresh').addEventListener('click', async event => {
  const button = event.currentTarget;
  const status = document.getElementById('refresh-status');
  const pages = [...document.querySelectorAll('.countries a')].map(a => a.href);
  const files = ['./', 'assets/app.js', 'assets/styles.css', ...pages];
  const pressed = performance.now();
  button.disabled = true;
  status.textContent = 'Actualizando…';
  // What the button cost, for the analytics (see assets/app.js). The tracker
  // may be absent, and then nothing is said; when it is there, the reload
  // waits up to half a second for the event to leave.
  const report = async ok => {
    const ms = Math.round(performance.now() - pressed);
    const took = ms < 1000 ? '<1s' : ms < 2000 ? '1-2s' : ms < 5000 ? '2-5s' : ms < 10000 ? '5-10s' : '>10s';
    try {
      await Promise.race([window.umami?.track('refresh', { ok, ms, took }),
                          new Promise(resolve => setTimeout(resolve, 500))]);
    } catch { /* never breaks the page */ }
  };

  const results = await Promise.allSettled(files.map(async url => {
    const response = await fetch(url, { cache: 'reload' });
    if (!response.ok) throw new Error(`${response.status} ${url}`);
    await response.arrayBuffer();          // read it all, or it is not cached
  }));

  // The catalogues are versioned by their manifest and refresh themselves;
  // they are dropped anyway so that this button leaves nothing old behind.
  for (const page of pages) {
    const name = 'rosa-camina-' + new URL(page).pathname.split('/').filter(Boolean).pop();
    try { indexedDB.deleteDatabase(name); } catch { /* no storage, nothing to drop */ }
  }

  if (results.some(r => r.status === 'rejected')) {
    status.textContent = 'No se pudo actualizar. ¿Hay conexión?';
    button.disabled = false;
    report(false);
    return;
  }
  status.textContent = 'Listo.';
  await report(true);
  // The next country page loaded in this tab reports itself as the rest of
  // this button's cost (assets/app.js reads and clears the flag).
  try { sessionStorage.setItem('rosa-camina-refreshed', '1'); } catch { /* no storage */ }
  location.reload();
});
</script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="9cbd65ba-87d6-4dd0-92ed-14cff5979f93" data-domains="rosacamina.org" data-performance="true" data-do-not-track="true"></script>

</body>
</html>
